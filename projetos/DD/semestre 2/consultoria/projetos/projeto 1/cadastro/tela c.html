<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Code Tech</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <header>
    <nav>
        <div class="navbar-container">
            <a class="navbar-brand" href="#">Code Tech</a>
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
                <li class="nav-item"><a class="nav-link" href="cadastro.html">Cadastro</a></li>
                <li class="nav-item"><a class="nav-link" href="support.html">Suporte</a></li>
            </ul>
        </div>
    </nav>
  </header>

  <main>
    <section class="form-container">
        <h2>Cadastro</h2>
        <form action="#" method="post">
            <label for="name">Nome:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Senha:</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Cadastrar</button>
        </form>
    </section>
  </main>

  <footer>
      <p>&copy; 2024 Code Tech. Todos os direitos reservados.</p>
  </footer>
</body>
</html>
