<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa do Coronavírus</title>
    <link rel="stylesheet" href="css/css.css">
    <script defer src="js/js.js"></script> <!-- Correção: Adicionar defer para garantir o carregamento correto -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url('imagens/fundo.png');
            background-size: cover;
            background-position: center;
            color: white;
        }

        table {
            font-family: arial, sans-serif;
            border-collapse: collapse;
            width: 100%;
        }

        td,
        th {
            border: 1px solid #dddddd;
            text-align: left;
            padding: 8px;
        }

        tr:nth-child(even) {
            background-color: #dddddd;
        }
    </style>
</head>

<body onload="limpa()">
    <div class="container">
        <h1>Pesquisa do Coronavírus</h1>

        <div class="form-section">
            <div class="left-section">
                <img src="imagens/terra.png" class="earth-image">
                <div class="language-switch">
                    <img src="imagens/bandeiragrande.jpg" class="flag">
                    <img src="imagens/vacina.jpeg" class="flag">
                </div>
                <a href="https://bvsms.saude.gov.br/covid-19-2/">
                    <button class="info-btn">O que é a Covid?</button>
                </a>
                <img src="imagens/corona.png" class="virus-icon">
            </div>

            <div class="form">
                <label for="name">Nome:</label>
                <input type="text" id="naime" name="name">

                <label for="age">Idade:</label>
                <input type="number" id="age" name="age">

                <label for="gender">Sexo:</label>
                <select id="gender" name="gender">
                    <option value="masculino">Masculino</option>
                    <option value="feminino">Feminino</option>
                </select>

                <label for="temperature">Temperatura:</label>
                <input type="number" id="temperature" name="temperature" step="0.1">

                <label for="origin">Origem:</label>
                <select id="origin" name="origin">
                    <option value="SP">SP</option>
                    <option value="RJ">RJ</option>
                    <option value="MG">MG</option>
                    <option value="MG">AC</option>
                    <option value="MG">AP</option>
                    <option value="MG">PA</option>
                    <option value="MG">RO</option>
                    <option value="MG">RR</option>
                    <option value="MG">TO</option>
                    <option value="MG">MA</option>
                    <option value="MG">PI</option>
                    <option value="MG">CE</option>
                    <option value="MG">RN</option>
                    <option value="MG">PB</option>
                    <option value="MG">PE</option>
                    <option value="MG">AL</option>
                    <option value="MG">SE</option>
                    <option value="MG">BA</option>
                    <option value="MG">MS</option>
                    <option value="MG">MT</option>
                    <option value="MG">GO</option>
                    <option value="MG">DF</option>
                    <option value="MG">ES</option>
                    <option value="MG">PR</option>
                    <option value="MG">SC</option>
                    <option value="MG">RS</option>
                </select>
            </div>

            <div class="right-section">
                <img src="imagens/etec.jpg" alt="Logo Etec VAC" class="etec-logo">
                <div class="buttons">
                    <button id="grava" class="action-btn">Grava</button>



                    <button class="action-btn" onclick="pasta(),box.showModal()">Lista</button>
                    <dialog id="box" onclick="box.close()"
                        style="height: 50%; width: 50%; border-radius: 5%; background-image: linear-gradient(to bottom right, rgb(21, 99, 188), rgb(140, 52, 228)); position: absolute; left: 24%;top: 30%; text-align: left, justify;color: aliceblue;">
                        <table>
                            <tr>
                                <th class="c">Nome</th>
                                <th class="c">Idade</th>
                                <th class="c">Genero</th>
                                <th class="c">Temperatura</th>
                                <th class="c">Origem</th>

                            </tr>
                            <tr>
                                <th class="c1" id="MYNAME"></th>
                                <th class="c1" id="MYAGE"></th>
                                <th class="c1" id="MYGENDER"></th>
                                <th class="c1" id="MYTEMP"></th>
                                <th class="c1" id="MYORI"></th>

                            </tr>

                        </table>

                    </dialog>
                </div>
            </div>
        </div>

        <div class="stats">
            <p>Entrevistados: <span id="entre"></span></p>
            <p>Total Febris: <span id="toF"></span></p>
            <p> <span id="toF2"></span></p>
            <p>Grupo de Risco: <span id="Grisc"></span></p>
            <p><span id="Grisc2"></span></p>
            <p>Febris de Risco: <span id="Frisc"></span></p>
            <p> <span id="Frisc2"></span></p>
            <p>Masculino: <span id="masc"></span></p>
            <p>Feminino: <span id="fem"></span></p>
        </div>
    </div>
</body>

</html>
