<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="css/estilo.css">
    <script src="js/função.js"></script>
</head>
<body>
    <div class="calculator">
        <div class="display" id="resposta"></div>
        <div class="buttons">
            <button class="btn" onclick="Zerar()">C</button>
            <button class="btn" onclick="digito('/')">/</button>
            <button class="btn" onclick="digito('*')">*</button>
            <button class="btn" onclick="digito('-')">-</button>
            <button class="btn" onclick="digito('7')">7</button>
            <button class="btn" onclick="digito('8')">8</button>
            <button class="btn" onclick="digito('9')">9</button>
            <button class="btn" onclick="digito('+')">+</button>
            <button class="btn" onclick="digito('4')">4</button>
            <button class="btn" onclick="digito('5')">5</button>
            <button class="btn" onclick="digito('6')">6</button>
            <button class="btn" onclick="calcular()">=</button>
            <button class="btn" onclick="digito('1')">1</button>
            <button class="btn" onclick="digito('2')">2</button>
            <button class="btn" onclick="digito('3')">3</button>
            <button class="btn" onclick="digito('0')">0</button>
            <button class="btn" onclick="digito('.')">.</button>
        </div>
    </div>
    
</body>
</html>
